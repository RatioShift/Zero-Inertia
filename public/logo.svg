<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Obsidian Navy Gradient -->
    <linearGradient id="birdLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Website Signature Electric Blue Aura (Cobalt -> Signal Blue -> Cyan) -->
    <linearGradient id="birdAuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="35%" stop-color="#006bff"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="birdBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Badge Frame -->
  <rect width="200" height="200" rx="44" fill="url(#birdLogoBg)"/>
  <rect width="200" height="200" rx="44" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Centered Swift / Falcon Bird in Aerodynamic Flight -->
  <g transform="translate(100, 100) scale(0.72) translate(-86.5, -98.5)">
    <!-- Layer 1: Radiant Website Gradient Contour (Ghost Image 1 Style) -->
    <g filter="url(#birdBloom)" stroke="url(#birdAuraGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M 108 15 L 110 20 L 111 33 L 115 40 L 129 23 L 140 12 L 149 10 L 153 11 L 159 15 L 156 21 L 155 27 L 161 45 L 162 56 L 163 57 L 163 69 L 161 79 L 152 98 L 134 121 L 112 143 L 64 186 L 61 187 L 57 186 L 55 183 L 55 179 L 57 175 L 113 78 L 111 76 L 104 76 L 89 81 L 69 91 L 19 121 L 14 121 L 11 118 L 10 113 L 84 19 L 89 14 L 96 11 L 101 11 L 107 14 Z"/>
    </g>

    <!-- Layer 2: Dark Border Gap separating glow from core -->
    <g stroke="#050811" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="#050811">
      <path d="M 108 15 L 110 20 L 111 33 L 115 40 L 129 23 L 140 12 L 149 10 L 153 11 L 159 15 L 156 21 L 155 27 L 161 45 L 162 56 L 163 57 L 163 69 L 161 79 L 152 98 L 134 121 L 112 143 L 64 186 L 61 187 L 57 186 L 55 183 L 55 179 L 57 175 L 113 78 L 111 76 L 104 76 L 89 81 L 69 91 L 19 121 L 14 121 L 11 118 L 10 113 L 84 19 L 89 14 L 96 11 L 101 11 L 107 14 Z"/>
    </g>

    <!-- Layer 3: Solid Crisp White Bird Body with Eye Cutout (fill-rule evenodd) -->
    <g fill="#FFFFFF" fill-rule="evenodd">
      <path d="M 108 15 L 110 20 L 111 33 L 115 40 L 129 23 L 140 12 L 149 10 L 153 11 L 159 15 L 156 21 L 155 27 L 161 45 L 162 56 L 163 57 L 163 69 L 161 79 L 152 98 L 134 121 L 112 143 L 64 186 L 61 187 L 57 186 L 55 183 L 55 179 L 57 175 L 113 78 L 111 76 L 104 76 L 89 81 L 69 91 L 19 121 L 14 121 L 11 118 L 10 113 L 84 19 L 89 14 L 96 11 L 101 11 L 107 14 Z M 143 19 L 136 27 L 138 29 L 141 29 L 145 25 L 144 20 Z"/>
    </g>
  </g>
</svg>
